services:
  - type: web
    name: finmate-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: finmate-db
    plan: free
    databaseName: cuan_db
    user: cuan_user
