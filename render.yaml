services:
  - type: web
    name: finmate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /openapi.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finmate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: "8000"

databases:
  - name: finmate-db
    plan: free
    databaseName: cuan_db
    user: cuan_user
